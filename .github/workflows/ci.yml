name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Called by the Release workflow, so a release is only ever cut from a commit whose tests passed.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the *caller's* name when called from Release, so the two never share a group.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (OctoPrint ${{ matrix.octoprint }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the octoprint/octoprint image runs; 3.13 is the newest both OctoPrint lines support.
        python: ["3.10", "3.13"]
        octoprint: ["1.11.8", "2.0.0rc6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # OctoPrint is a dependency of the tests (they run a real OctoPrint), not of the package.
      - name: Install OctoPrint ${{ matrix.octoprint }} and the plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre "octoprint==${{ matrix.octoprint }}" -r tests/requirements.txt
          python -m pip install -e .
      - name: Test
        run: python -m pytest tests -v --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.16.8"
      # Pyflakes (undefined names, unused imports) and syntax errors only. No style rules on purpose:
      # this is upstream's code, and a formatter would bury real changes in a whole-file rewrite.
      - run: ruff check --select F,E9 octoprint_backupscheduler tests

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "bandit==1.9.4"
      # Medium severity and above fails the build.
      - run: bandit -q -r octoprint_backupscheduler -ll

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install "build==1.6.1"
      - run: python -m build
      # The Release workflow publishes exactly what this builds, so prove it ships what the plugin needs.
      - name: The wheel contains the templates, JavaScript and mail templates
        run: |
          unzip -l dist/*.whl > wheel-contents.txt
          for f in octoprint_backupscheduler/__init__.py \
                   octoprint_backupscheduler/schedule/__init__.py \
                   octoprint_backupscheduler/templates/backupscheduler_settings.jinja2 \
                   octoprint_backupscheduler/templates/backupscheduler_wizard.jinja2 \
                   octoprint_backupscheduler/static/js/backupscheduler.js \
                   octoprint_backupscheduler/static/mailtmpl/backup_failed.html; do
            grep -q "$f" wheel-contents.txt || { echo "missing from the wheel: $f"; exit 1; }
          done

  # Installs the way a real deployment does (pip from the source tree, with pip's own isolated
  # build) inside the official OctoPrint image, whose pip is older than the runner's.
  octoprint-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: octoprint/octoprint:1.11.8@sha256:5ea0181e476597faa2800c991af4ce16903005f46b4c16666a4080ad606310bb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python -m pip install --no-deps .
      - name: OctoPrint loads the plugin
        run: |
          python - <<'EOF'
          from importlib.metadata import entry_points
          (ep,) = [e for e in entry_points(group="octoprint.plugin") if e.name == "backupscheduler"]
          import octoprint_backupscheduler as plugin
          # What OctoPrint does after importing: the check, then __plugin_load__, which creates the
          # implementation and its hooks (they don't exist at import time in this plugin).
          assert plugin.__plugin_check__(), "plugin reports this OctoPrint as incompatible"
          plugin.__plugin_load__()
          assert "octoprint.plugin.backup.after_backup" in plugin.__plugin_hooks__, plugin.__plugin_hooks__
          print("ok", ep.value, plugin.__plugin_implementation__)
          EOF

  # Workflow lint and a secret scan of the full history: a leaked key in a public repo's history
  # is already exposed, so this one fails loudly.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ZIZMOR_VERSION: 1.32.0
      ACTIONLINT_PY_VERSION: 1.7.12.25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: actionlint + zizmor (GitHub Actions)
        run: |
          python -m pip install --quiet "zizmor==${ZIZMOR_VERSION}" "actionlint-py==${ACTIONLINT_PY_VERSION}" "shellcheck-py==0.11.0.1"
          actionlint
          zizmor --offline --min-severity low .github/workflows
      - name: gitleaks (full history)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
